---
# Pins the CI platform/version matrix for this role. Without this, ansible-generator
# falls back to default_platforms and silently discards these choices on regenerate.
platforms:
  # EL and Fedora are excluded entirely: xinetd is gone from both. RHEL9+
  # dropped it in favor of systemd sockets (Red Hat's own guidance), and
  # Fedora retired the package around F34 (dead.package marker in rawhide,
  # no branch for it as of f43). EPEL doesn't carry it either.
  - name: Debian
    versions:
      - all
  - name: Ubuntu
    versions:
      - all
